name: Android Dynamic Release

on:
  workflow_dispatch:
    inputs:
      Mode:
        description: 'Config mode'
        required: true
        type: choice
        default: 'json'
        options:
          - json
          - manual
      TapsellJson:
        description: 'tapsell.json content (json mode)'
        required: false
      AppKey:
        description: 'Tapsell App Key (manual mode)'
        required: false
        default: '76798342-99a7-4a5f-bf5a-60a088d5dcfb'
      AdmobAppKey:
        description: 'Admob App Key (manual mode)'
        required: false
        default: 'ca-app-pub-3940256099942544~3347511713'
      AppName:
        description: 'App name (manual mode)'
        required: false
        default: 'sample'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup from JSON
        if: ${{ github.event.inputs.Mode == 'json' }}
        env:
          TAPSELL_JSON: ${{ github.event.inputs.TapsellJson }}
        run: |
          ASSETS_DIR="sample-kotlin/src/main/assets"
          mkdir -p "$ASSETS_DIR"

          printf '%s\n' "$TAPSELL_JSON" > "$ASSETS_DIR/tapsell.json"

          {
            echo "TAPSELL_APP_KEY=$(jq -r '.["app-key"]' "$ASSETS_DIR/tapsell.json")"
            echo "ADMOB_APP_KEY=$(jq -r '.["admob-key"]' "$ASSETS_DIR/tapsell.json")"
            echo "APP_NAME=$(jq -r '.["app-name"]' "$ASSETS_DIR/tapsell.json")"
          } >> "$GITHUB_ENV"

          echo "Wrote tapsell.json (zones: $(jq '.zones | length' "$ASSETS_DIR/tapsell.json"))"

      - name: Setup from manual inputs
        if: ${{ github.event.inputs.Mode == 'manual' }}
        run: |
          {
            echo "TAPSELL_APP_KEY=${{ github.event.inputs.AppKey }}"
            echo "ADMOB_APP_KEY=${{ github.event.inputs.AdmobAppKey }}"
            echo "APP_NAME=${{ github.event.inputs.AppName }}"
          } >> "$GITHUB_ENV"

      - name: Sanitize app name
        run: |
          APP_NAME=$(printf '%s' "${{ env.APP_NAME }}" | tr -cd '[:alnum:]')
          [ -z "$APP_NAME" ] && APP_NAME='sample'
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Update app keys in build.gradle.kts
        run: |
          ./scripts/change-app.sh \
            "${{ env.TAPSELL_APP_KEY }}" \
            "${{ env.ADMOB_APP_KEY }}" \
            "${{ env.APP_NAME }}"

      - name: Build Release APK
        run: ./gradlew sample-kotlin:assembleRelease

      - name: Upload Release Build to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: sample-kotlin/build/outputs/apk/release/*universal-release*.apk
